# Local logging for Riffle: Loki stores logs, Alloy ships them in, Grafana shows them.
#
#   cd infra
#   cp .env.example .env                    # set GF_SECURITY_ADMIN_PASSWORD
#   docker compose -f compose.logging.yaml up -d
#
# The configuration for each part lives beside this file: loki/, alloy/, grafana/.
# Images are pinned to exact versions on purpose; to upgrade, change the tag here and
# read that project's release notes first.

name: riffle-logging

services:
  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    ports:
      # Published so a command on the host could push to it later; private by default.
      - "${LOGGING_BIND_ADDR:-127.0.0.1}:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    # No healthcheck on purpose: Loki's image has no shell, wget or curl, so nothing a
    # healthcheck could run exists inside it. Check from the host: curl localhost:3100/ready
    # (it answers 503 for about 15 seconds after start, then 200). Alloy and Grafana start
    # after it and cope with that wait: Alloy retries its pushes, Grafana's data source
    # reports an error until Loki is ready.

  alloy:
    image: grafana/alloy:v1.21.2
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    ports:
      # Alloy's own page: shows each part of the pipeline and whether it is healthy.
      - "${LOGGING_BIND_ADDR:-127.0.0.1}:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Where Alloy remembers how far it has read, so a restart does not re-send everything.
      - alloy-data:/var/lib/alloy/data
      # Read-only mount, but the Docker socket is powerful: anything that can talk to it can
      # control Docker. Fine on your own machine; see alloy/README.md before using elsewhere.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The host drop folder (<repo>/logs by default), for commands run outside Docker.
      - ${RIFFLE_LOGS_DIR:-../logs}:/var/log/riffle:ro
    depends_on:
      loki:
        condition: service_started
    # The image has bash but no curl or wget, so ask its /-/ready page over a bash socket.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]'
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # A key with no value passes the variable of the same name through from .env. Do not
      # swap this for a substitution that carries an error message: GitGuardian reads that
      # message as a hardcoded password (it flagged exactly that here, and the Airflow stack
      # met the same). The entrypoint below is what stops Grafana starting without one.
      GF_SECURITY_ADMIN_PASSWORD:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Nothing leaves this machine: no usage reports, no update checks.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    # Without a login set, Grafana would start with its built-in admin/admin. Refuse instead.
    # Written inline: a script file mounted from a Windows checkout would get Windows line
    # endings and fail inside the Linux container.
    entrypoint:
      - /bin/sh
      - -c
      - 'test -n "$${GF_SECURITY_ADMIN_PASSWORD}" || { echo "The Grafana admin login is not set: add it to infra/.env (see .env.example)." >&2; exit 1; }; exec /run.sh'
    ports:
      - "${LOGGING_BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  loki-data:
  alloy-data:
  grafana-data:
