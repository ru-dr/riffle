# Loki, single process, files on a volume. Plenty for a few PCs' traces (ADR 0017).
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 2160h          # 90 days
  allow_structured_metadata: true
  # a re-synced trace is read again from its start; lines Loki already has are dropped by content, and old
  # ones must not be refused, since a run's trace is often synced days after its first lines were written
  reject_old_samples: false
querier:
  query_ingesters_within: 0s       # one node: always search what is still in memory, so a backfill of old lines shows at once
ingester:
  chunk_idle_period: 5m            # a quiet stream reaches the disk (and survives a restart) in minutes, not half an hour
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
analytics:
  reporting_enabled: false
