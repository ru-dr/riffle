# The team store for mined data and run logs (ADR 0014). One service. It runs on
# a laptop (no bucket, files on a volume) and on one GCP VM (bucket set, the VM's
# service account does the auth, no key file).
#
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose exec riffle-data python manage.py add-reader lead
#   docker compose exec riffle-data python manage.py add-pc pc1

name: riffle-data

services:
  riffle-data:
    image: riffle-data:local
    build: .
    pull_policy: never
    restart: unless-stopped
    environment:
      RIFFLE_BUCKET: ${RIFFLE_BUCKET:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      BQ_LOCATION: ${BQ_LOCATION:-US}
      RIFFLE_MAX_FILE_BYTES: ${RIFFLE_MAX_FILE_BYTES:-2147483648}
    # Loopback by default. Put a TLS proxy or an IAP / Tailscale tunnel in front of it;
    # the service speaks plain HTTP and its tokens would cross the network in clear.
    ports:
      - "${RIFFLE_BIND_ADDR:-127.0.0.1}:${RIFFLE_PORT:-8470}:8470"
    volumes:
      - store-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  store-data:
