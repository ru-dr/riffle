# Loki for local use: one process, logs on the local disk, nothing replicated.
# Loki 3.x. Read by infra/compose.logging.yaml with -config.expand-env=true, so
# ${NAME:-default} below is filled from the environment.

# One tenant. Safe because the port is published to 127.0.0.1 only by default.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

# TSDB index, schema v13: the current format for new installs. `from` is the date
# the schema starts; it is in the past so that all data uses it.
schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # How long logs are kept. Needs 24h or more. Set LOKI_RETENTION in .env.
  retention_period: ${LOKI_RETENTION:-168h}
  # A line older than this is refused when it arrives. It matters when Alloy first
  # reads a log file that already holds old lines: those older than a week are skipped.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

# The compactor is what deletes data older than retention_period.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
  compaction_interval: 10m

# Nothing leaves this machine: no usage reports to Grafana Labs.
analytics:
  reporting_enabled: false
