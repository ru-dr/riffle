# The Kubernetes service account of every Riffle service, each annotated with its Google
# service account (infra/terraform/envs/staging/09-identity.tf): a pod running as it gets that
# account's permissions through Workload Identity, with no key. Service charts use these
# accounts (serviceAccountName) instead of creating their own.
#
# Loki, Tempo, Grafana and KEDA get theirs from their Helm charts (apps/staging).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: intake
  namespace: riffle-serving
  labels:
    app.kubernetes.io/name: intake
    app.kubernetes.io/part-of: riffle
  annotations:
    iam.gke.io/gcp-service-account: riffle-staging-intake@riffle-infra-platform.iam.gserviceaccount.com
---
