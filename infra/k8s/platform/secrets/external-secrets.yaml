# What each service gets, as the Kubernetes Secret <service>-secrets. Secrets filled by hand
# (the GitHub App key and client secret) show SecretSyncedError until their value is added.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intake
  namespace: riffle-serving
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: intake
  target:
    name: intake-secrets   # the service reads it with envFrom: secretRef
    creationPolicy: Owner
  data:
    - secretKey: WEBHOOK_SECRET
      remoteRef:
        key: riffle-staging-github-webhook-secret
    - secretKey: REDIS_AUTH
      remoteRef:
        key: riffle-staging-redis-auth
---
