# One SecretStore per service that needs secrets: it reads Secret Manager as that service's
# own Google account (through its Kubernetes service account), so a service can only ever get
# the secrets Terraform granted it (infra/terraform/envs/staging/09-identity.tf).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: intake
  namespace: riffle-serving
spec:
  provider:
    gcpsm:
      projectID: riffle-infra-platform
      auth:
        workloadIdentity:
          clusterLocation: us-east4
          clusterName: riffle-staging
          clusterProjectID: riffle-infra-platform
          serviceAccountRef:
            name: intake
---
