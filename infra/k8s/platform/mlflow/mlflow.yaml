# MLflow, the model registry (diagram: "Model registry · MLflow · versions pinned"). Run
# metadata and model versions live in the Cloud SQL database mlflow; model files go to the
# models bucket, uploaded and downloaded through this server (--serve-artifacts), so clients
# only need to reach MLflow. Aliases "champion" and "previous" are moved by register_model.py.
#
# It logs in to Cloud SQL as its own Google account through the proxy sidecar (no password);
# the database grants come from platform/db-migrate/grants.sql. Reached inside the cluster at
# http://mlflow.riffle-ml.svc:5000; from a laptop with kubectl port-forward (infra/k8s/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: riffle-ml
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: riffle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: riffle
    spec:
      serviceAccountName: mlflow # Google account riffle-staging-mlflow
      priorityClassName: riffle-workers
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: cloud-sql-proxy # native sidecar: starts first, runs beside MLflow
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.28.1
          restartPolicy: Always
          args:
            - --auto-iam-authn
            - --private-ip
            - --port=5432
            - --structured-logs
            - --health-check
            - --http-address=0.0.0.0
            - $(DB_CONNECTION_NAME)
          envFrom:
            - configMapRef: { name: riffle-platform-settings }
          startupProbe:
            httpGet: { path: /startup, port: 9090 }
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 50m, memory: 64Mi }
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.18.0-full # -full has the Postgres driver and Cloud Storage
          command: [mlflow, server]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=2
            # The IAM database user is the Google account without .gserviceaccount.com (@ as %40).
            - --backend-store-uri=postgresql+psycopg2://riffle-staging-mlflow%40riffle-infra-platform.iam@127.0.0.1:5432/mlflow
            - --serve-artifacts
            - --artifacts-destination=gs://$(BUCKET_MODELS)/mlflow
            # MLflow refuses Host headers other than localhost and private IPs unless listed:
            # these are the names pods use to reach it.
            - --allowed-hosts=mlflow,mlflow:5000,mlflow.riffle-ml,mlflow.riffle-ml:5000,mlflow.riffle-ml.svc,mlflow.riffle-ml.svc:5000,mlflow.riffle-ml.svc.cluster.local,mlflow.riffle-ml.svc.cluster.local:5000,localhost,localhost:5000
            - --expose-prometheus=/tmp/prometheus
          envFrom:
            - configMapRef: { name: riffle-platform-settings }
          env:
            - { name: HOME, value: /tmp }
          ports:
            - { name: http, containerPort: 5000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: riffle-ml
  labels:
    app.kubernetes.io/name: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - { name: http, port: 5000, targetPort: http }
