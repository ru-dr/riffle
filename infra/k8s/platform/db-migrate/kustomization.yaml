apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: riffle-workers
resources:
  - job.yaml
configMapGenerator:
  # The SQL files of infra/db/migrations. Kustomize cannot glob, so a new migration is added
  # here too. Reading outside this folder needs --load-restrictor LoadRestrictionsNone, which
  # Argo CD is configured with (infra/terraform/envs/staging-bootstrap/values/argocd.yaml).
  - name: db-migrations
    files:
      - ../../../db/migrations/20261125000001_tenants_repos_score_results.sql
  - name: db-grants
    files:
      - grants.sql
