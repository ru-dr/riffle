apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - global-training.yaml
images:
  # The training image (infra/docker/outcome-training), pushed by CI. Tags are immutable in
  # Artifact Registry: CI sets newTag to the image it built. Until then the CronJob is suspended.
  - name: outcome-training
    newName: us-east4-docker.pkg.dev/riffle-infra-platform/riffle-staging/outcome-training
    newTag: not-built-yet
