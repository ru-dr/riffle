# Weekly global training (diagram: Retrain triggers "weekly" -> Global training -> Promotion
# gate). Each run is a Job in the Kueue queue "training": it waits until the queue's quota has
# room, then runs on Spot capacity, apart from the live path.
#
#   1. fetch-data  copies the data release from the snapshots bucket
#   2. train       the outcome model container (infra/docker/outcome-training): notebook,
#                  bias report, SHAP and model_gates.py; exits 1 if a gate fails
#   3. publish     copies the results (models, eval, notebook) to the models bucket, under
#                  runs/<job name>/; only reached when every gate passed
#
# SUSPENDED until the training image is in Artifact Registry and a data release is in the
# snapshots bucket (README, "Training"). Registering a passing run in MLflow is the next step
# (register_model.py needs mlflow in the image); until then results are kept in the bucket.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: global-training
  namespace: riffle-ml
  labels:
    app.kubernetes.io/name: trainer
    app.kubernetes.io/part-of: riffle
spec:
  schedule: "0 2 * * 0" # Sundays 02:00 UTC
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: training # admitted by Kueue, bounded by its quota
        app.kubernetes.io/name: trainer
    spec:
      backoffLimit: 2
      # A failed gate or step (train exits 1 or 2) fails the run at once: retrying the same
      # data gives the same answer. A Spot preemption is not counted: the run starts again.
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: train
              operator: In
              values: [1, 2]
          - action: Ignore
            onPodConditions:
              - type: DisruptionTarget
                status: "True"
      activeDeadlineSeconds: 14400 # 4 h
      ttlSecondsAfterFinished: 604800 # keep a finished run's Job (and logs) for 7 days
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trainer
            app.kubernetes.io/part-of: riffle
        spec:
          serviceAccountName: trainer # Google account riffle-staging-trainer
          priorityClassName: riffle-batch
          restartPolicy: Never
          terminationGracePeriodSeconds: 25 # Autopilot's limit for Spot pods
          initContainers:
            - name: fetch-data
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:594.0.1-slim
              command: [sh, -c]
              args:
                - gcloud storage cp "gs://$BUCKET_SNAPSHOTS/$DATA_RELEASE" /data/dataset.parquet
              envFrom:
                - configMapRef: { name: riffle-platform-settings }
              env:
                - { name: DATA_RELEASE, value: releases/dataset_merged.parquet }
              volumeMounts:
                - { name: data, mountPath: /data }
              resources:
                requests: { cpu: 250m, memory: 256Mi }
            - name: train
              image: outcome-training # set to the Artifact Registry image in kustomization.yaml
              env:
                - { name: RIFFLE_DATA, value: /data/dataset.parquet }
                - { name: OUT, value: /out }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: out, mountPath: /out }
              resources:
                requests: { cpu: "8", memory: 32Gi } # about 30 min on 16 cores (pipelines/training/outcome/README.md)
          containers:
            - name: publish
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:594.0.1-slim
              command: [sh, -c]
              args:
                - gcloud storage cp -r /out "gs://$BUCKET_MODELS/runs/$JOB_NAME/"
              envFrom:
                - configMapRef: { name: riffle-platform-settings }
              env:
                - name: JOB_NAME
                  valueFrom:
                    fieldRef: { fieldPath: "metadata.labels['batch.kubernetes.io/job-name']" }
              volumeMounts:
                - { name: out, mountPath: /out, readOnly: true }
              resources:
                requests: { cpu: 250m, memory: 256Mi }
          volumes:
            - name: data
              emptyDir: {}
            - name: out
              emptyDir: {}
