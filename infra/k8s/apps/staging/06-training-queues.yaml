# Wave -1. The Kueue queue training Jobs go through: Spot capacity, a fixed CPU and memory
# quota. Needs the Kueue CRDs from wave -2. Source: infra/k8s/platform/training-queues.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: training-queues
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ru-dr/riffle.git
    targetRevision: main
    path: infra/k8s/platform/training-queues
  destination:
    server: https://kubernetes.default.svc
    namespace: riffle-ml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
