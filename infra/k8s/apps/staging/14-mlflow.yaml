# Wave 2 (after db-migrate has granted the mlflow user its database). MLflow, the model registry:
# metadata in Cloud SQL, files in the models bucket. Source: infra/k8s/platform/mlflow.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ru-dr/riffle.git
    targetRevision: main
    path: infra/k8s/platform/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: riffle-ml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
