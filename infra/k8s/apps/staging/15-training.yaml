# Wave 2. The weekly global training CronJob, through the Kueue queue "training" (suspended until
# the training image and a data release exist). Source: infra/k8s/platform/training.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: training
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ru-dr/riffle.git
    targetRevision: main
    path: infra/k8s/platform/training
  destination:
    server: https://kubernetes.default.svc
    namespace: riffle-ml
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
