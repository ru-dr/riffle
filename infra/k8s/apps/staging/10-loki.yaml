# Wave 2. Loki stores the services' JSON logs in the loki bucket (Terraform phase 6), as the
# loki Google account. One process (single binary); logs kept 30 days.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.7.0
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: gcs
            bucketNames:
              chunks: riffle-infra-platform-staging-loki
              ruler: riffle-infra-platform-staging-loki
              admin: riffle-infra-platform-staging-loki
          schemaConfig:
            configs:
            - from: '2026-01-01'
              store: tsdb
              object_store: gcs
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
          limits_config:
            retention_period: 720h
            allow_structured_metadata: true
          compactor:
            retention_enabled: true
            delete_request_store: gcs
          analytics:
            reporting_enabled: false
        serviceAccount:
          create: true
          name: loki
          annotations:
            iam.gke.io/gcp-service-account: riffle-staging-loki@riffle-infra-platform.iam.gserviceaccount.com
        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        gateway:
          enabled: false
        minio:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
