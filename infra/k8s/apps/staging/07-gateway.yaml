# Wave 0. The Gateway (creates the Google load balancer on the fixed IP), the routes /webhook,
# /healthz and /app, and Cloud Armor on the backends. Source: infra/k8s/platform/gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ru-dr/riffle.git
    targetRevision: main
    path: infra/k8s/platform/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: riffle-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
