# Wave 3. Alloy collects the Riffle pods' logs (through the Kubernetes API) for Loki, and
# receives the services' traces (OTLP) for Tempo. One Deployment, not a DaemonSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.16.0
    helm:
      releaseName: alloy
      valuesObject:
        controller:
          type: deployment
          replicas: 1
        alloy:
          enableReporting: false
          configMap:
            create: true
            content: |
              // Logs: tail the pods through the Kubernetes API (Autopilot does not let a pod read the
              // node's log files): the Riffle namespaces and the platform's (Argo CD, External Secrets,
              // KEDA, Kueue, the observability stack), so a failing platform component shows in Loki
              // too. Labels: namespace, service, pod, container, level. delivery_id and tenant_id are
              // structured metadata (searchable without making a label per PR).
              discovery.kubernetes "pods" {
                role = "pod"
                namespaces {
                  names = ["riffle-serving", "riffle-workers", "riffle-ml", "argocd", "observability",
                           "external-secrets", "keda", "kueue-system"]
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                // service: app.kubernetes.io/name, else the app label, else the Job's name.
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_label_job_name"]
                  separator     = ";"
                  regex         = "^;*([^;]+).*$"
                  target_label  = "service"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pods.output
                forward_to = [loki.process.riffle.receiver]
              }

              // One level label for every format: JSON "level" (Riffle's Python services: info; intake's
              // Go slog: INFO), JSON "severity" (Cloud SQL Proxy), logfmt level= (Argo CD) and klog's
              // first letter (I, W, E, F). Always lower case: debug, info, warning, error.
              // The chart passes this file through Helm's tpl, so each Alloy template below is wrapped in
              // Helm's raw-string markers (double brace and backtick), which Helm prints unchanged. Keep
              // curly-brace pairs out of comments here: Helm would try to run them.
              loki.process "riffle" {
                stage.json {
                  expressions = { level = "level", severity = "severity", delivery_id = "delivery_id", tenant_id = "tenant_id" }
                }
                stage.regex {
                  expression = "(?:^|\\s)level=\"?(?P<logfmt_level>[A-Za-z]+)"
                }
                stage.regex {
                  expression = "^(?P<klog_level>[IWEF])\\d{4} "
                }
                stage.template {
                  source   = "level"
                  template = "{{`{{ $l := ToLower (or .level .severity .logfmt_level .klog_level) }}{{ if or (eq $l \"warn\") (eq $l \"w\") }}warning{{ else if or (eq $l \"err\") (eq $l \"e\") (eq $l \"f\") (eq $l \"fatal\") (eq $l \"critical\") (eq $l \"panic\") }}error{{ else if eq $l \"i\" }}info{{ else }}{{ $l }}{{ end }}`}}"
                }
                stage.labels {
                  values = { level = "" }
                }
                stage.structured_metadata {
                  values = { delivery_id = "", tenant_id = "" }
                }
                forward_to = [loki.write.default.receiver]
              }

              // Kubernetes events (OOMKilled, image pull errors, failed scheduling, probe failures) of the
              // same namespaces, as log lines with job="kubernetes-events"; level is warning or info.
              loki.source.kubernetes_events "events" {
                namespaces = ["riffle-serving", "riffle-workers", "riffle-ml", "argocd", "observability",
                              "external-secrets", "keda", "kueue-system"]
                job_name   = "kubernetes-events"
                log_format = "json"
                forward_to = [loki.process.events.receiver]
              }

              loki.process "events" {
                stage.json {
                  expressions = { level = "type" }
                }
                stage.template {
                  source   = "level"
                  template = "{{`{{ if eq .level \"Warning\" }}warning{{ else }}info{{ end }}`}}"
                }
                stage.labels {
                  values = { level = "" }
                }
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.observability.svc:3100/loki/api/v1/push"
                }
              }

              // Traces: services send OTLP here (alloy.observability.svc:4317 or :4318); forwarded to Tempo.
              otelcol.receiver.otlp "default" {
                grpc {
                  endpoint = "0.0.0.0:4317"
                }
                http {
                  endpoint = "0.0.0.0:4318"
                }
                output {
                  traces = [otelcol.exporter.otlp.tempo.input]
                }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.observability.svc:4317"
                  tls {
                    insecure = true
                  }
                }
              }
          extraPorts:
          - name: otlp-grpc
            port: 4317
            targetPort: 4317
            protocol: TCP
          - name: otlp-http
            port: 4318
            targetPort: 4318
            protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
