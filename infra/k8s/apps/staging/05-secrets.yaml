# Wave -1. One SecretStore and ExternalSecret per service that needs secrets. Needs the
# External Secrets CRDs from wave -2. Source: infra/k8s/platform/secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ru-dr/riffle.git
    targetRevision: main
    path: infra/k8s/platform/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: riffle-serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
