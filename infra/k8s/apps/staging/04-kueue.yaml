# Wave -2. Kueue: lets only a bounded number of training Jobs run at once (the training
# backpressure invariant). OCI chart; Argo CD knows the registry (values/argocd.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kueue
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: registry.k8s.io/kueue/charts
    chart: kueue
    targetRevision: 0.20.8
    helm:
      releaseName: kueue
      valuesObject: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: kueue-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
