# Wave 3. Grafana with Loki, Tempo and Managed Prometheus as data sources, and the dashboards of
# infra/k8s/platform/dashboards (16-dashboards.yaml). No public address:
# kubectl -n observability port-forward svc/grafana 3000:80 (user admin; password: gcloud secrets versions access latest --secret=riffle-staging-grafana-admin).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 14.6.1
    helm:
      releaseName: grafana
      valuesObject:
        serviceAccount:
          create: false
          name: grafana
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        grafana.ini:
          analytics:
            reporting_enabled: false
            check_for_updates: false
            check_for_plugin_updates: false
          users:
            allow_sign_up: false
          auth.anonymous:
            enabled: false
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              isDefault: true
              url: http://loki.observability.svc:3100
              jsonData: {}
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo.observability.svc:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
            - name: Managed Prometheus
              type: stackdriver
              uid: gmp
              access: proxy
              jsonData:
                authenticationType: gce
                defaultProject: riffle-infra-platform
        # Loads the dashboards in infra/k8s/platform/dashboards (ConfigMaps labelled
        # grafana_dashboard: "1" in this namespace) and reloads them when they change.
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
        # The sidecar may read ConfigMaps in this namespace only.
        rbac:
          namespaced: true
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
