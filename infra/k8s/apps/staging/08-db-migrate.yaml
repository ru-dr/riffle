# Wave 1. Applies infra/db/migrations to Cloud SQL and grants each service its database role,
# on every sync. Source: infra/k8s/platform/db-migrate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db-migrate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ru-dr/riffle.git
    targetRevision: main
    path: infra/k8s/platform/db-migrate
  destination:
    server: https://kubernetes.default.svc
    namespace: riffle-workers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
    - ServerSideApply=true
