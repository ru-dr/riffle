{{- if .Values.pdb.enabled }}
# Upgrades and scale-downs may not take the last pod away.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "riffle.name" . }}
  labels:
    {{- include "riffle.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "riffle.selector" . | nindent 6 }}
{{- end }}
