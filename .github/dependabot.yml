version: 2
updates:
  # The site's dependencies. bun.lock is the lockfile Vercel installs from,
  # so the bun ecosystem is the one that keeps it and package.json in step.
  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React and Next move together; separate PRs for them just fight.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      next:
        patterns: ["next", "geist"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
