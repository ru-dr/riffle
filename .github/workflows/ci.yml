name: CI

# The site is the only thing with a build today. As services land, add a job
# per service rather than growing this one - each one has its own toolchain.
on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: site/package.json

      # Fails if bun.lock and package.json disagree, which is the whole point
      # of committing the lockfile.
      - run: bun install --frozen-lockfile

      # next build runs TypeScript, so this covers typecheck and build in one
      # step. It also renders the OG images, which have failed before now.
      - run: bun run build

  # Schemas, their flat form (ADR 0012), and the repo miner matching
  # contracts/mined_dataset.schema.json. Python only; no network.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest jsonschema pyyaml

      - run: python contracts/gen_reference.py --check

      - run: python -m pytest contracts/tests pipelines/ingestion/repo_miner/tests -q

  # The pipelines with pandas and pyarrow installed, so the parquet paths, merge_shards and the
  # training loader run too (the contracts job above runs the miner with only the core
  # dependencies). The miner's tests include the contract-sync checks: its three tables
  # (dataset, snapshots, commit features) must match their schemas column for column, validate,
  # and flatten losslessly (ADR 0012). No network, no semgrep, no LLM.
  pipelines:
    name: pipelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest jsonschema pyyaml pandas pyarrow duckdb lizard

      - name: Repo miner (tables match their contracts)
        run: python -m pytest pipelines/ingestion/repo_miner/tests -q

      - name: Training loader
        run: python -m pytest pipelines/training/tests -q

      - name: Airflow start-up scripts
        run: python -m pytest infra/docker/airflow/tests -q

      - name: Team store (riffle-data) and the miner's sync client
        run: python -m pytest infra/docker/riffle-data/tests -q

  # The logging stack (Loki, Alloy, Grafana). Its own job: it is its own stack. Checks the
  # configuration and that Compose accepts the file; no container is started.
  logging:
    name: logging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest pyyaml

      - name: Logging stack configuration
        run: python -m pytest infra/tests/test_logging_stack.py -q
