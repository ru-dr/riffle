name: CI

# The site is the only thing with a build today. As services land, add a job
# per service rather than growing this one - each one has its own toolchain.
on:
  pull_request:
  push:
    branches: [main]

# A second push to a PR makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: site/package.json

      # Fails if bun.lock and package.json disagree, which is the whole point
      # of committing the lockfile.
      - run: bun install --frozen-lockfile

      # next build runs TypeScript, so this covers typecheck and build in one
      # step. It also renders the OG images, which have failed before now.
      - run: bun run build

  # Schemas, their flat form (ADR 0012), and the repo miner matching
  # contracts/mined_dataset.schema.json. Python only; no network.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest jsonschema pyyaml

      - run: python contracts/gen_reference.py --check

      - run: python -m pytest contracts/tests pipelines/ingestion/repo_miner/tests -q

  # The pipelines with pandas and pyarrow installed, so the parquet paths, merge_shards and the
  # training loader run too (the contracts job above runs the miner with only the core
  # dependencies). The miner's tests include the contract-sync checks: its three tables
  # (dataset, snapshots, commit features) must match their schemas column for column, validate,
  # and flatten losslessly (ADR 0012). No network, no semgrep, no LLM.
  pipelines:
    name: pipelines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest jsonschema pyyaml pandas pyarrow duckdb lizard matplotlib

      - name: Repo miner (tables match their contracts)
        run: python -m pytest pipelines/ingestion/repo_miner/tests -q

      - name: Training loader
        run: python -m pytest pipelines/training/tests -q

      - name: Outcome model experiments (point-in-time tests; the sequence-model tests skip without torch)
        run: python -m pytest pipelines/training/outcome/experiments -q

      - name: Airflow start-up scripts
        run: python -m pytest infra/docker/airflow/tests -q

      - name: Team store (riffle-data) and the miner's sync client
        run: python -m pytest infra/docker/riffle-data/tests -q

  # The outcome model's gates (guidelines 7.2, 7.3, 7.6): validation, bias, and no regression against the model on
  # main, read from the eval reports the notebook and bias_report.py commit. A failure blocks the merge. No data or
  # training here: retraining runs on a machine with the data release, and its eval reports come with the PR.
  model-gates:
    name: model gates
    runs-on: ubuntu-latest
    # pull-requests: write lets the job comment on the PR when the gates fail (the alert, guideline 7.5).
    permissions:
      contents: read
      pull-requests: write
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pandas

      - name: Eval reports of the model on main (the baseline)
        run: |
          mkdir -p /tmp/baseline
          git archive origin/main pipelines/training/outcome/eval | tar -x -C /tmp/baseline \
            || echo "no outcome eval reports on main yet: the regression checks are skipped"

      - name: Validation, bias and regression gates
        shell: bash
        run: >-
          python pipelines/training/outcome/model_gates.py
          --baseline /tmp/baseline/pipelines/training/outcome/eval
          | tee /tmp/gates.md

      # The alert: a failed gate posts its table as a comment on the PR, so GitHub notifies the author and the
      # reviewers. A PR from a fork gets a read-only token and cannot be commented on; the failed check still shows.
      - name: Comment on the PR when the gates fail
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "**The model gates failed on this PR.** The model must not be merged or registered until they pass."
            echo
            cat /tmp/gates.md 2>/dev/null || echo "(no gate table: the gates step did not finish)"
            echo
            echo "Run: $RUN_URL"
          } > /tmp/comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      # Optional: set the SLACK_WEBHOOK_URL secret to be told in Slack as well.
      - name: Alert on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: >-
          curl -sS -X POST -H 'Content-type: application/json'
          --data "{\"text\": \"Riffle model gates failed on ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}:
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          "$SLACK_WEBHOOK_URL"

  # The logging stack (Loki, Alloy, Grafana). Its own job: it is its own stack. Checks the
  # configuration and that Compose accepts the file; no container is started.
  logging:
    name: logging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest pyyaml

      - name: Logging stack configuration
        run: python -m pytest infra/tests/test_logging_stack.py -q

  # AIDev ingestion: its own job, as it is its own service. Offline only: a fake hub and the
  # committed inventory. The tests that talk to Hugging Face need RUN_NETWORK_TESTS=1 and are
  # not run here.
  aidev:
    name: aidev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pytest huggingface_hub pyarrow

      - name: AIDev pin and inventory (offline)
        run: python -m pytest pipelines/ingestion/aidev/tests -q

  # Terraform for the team store VM (ADR 0018): format and validity only; nothing is planned or applied here.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform fmt -check -recursive
        working-directory: infra/terraform

      # Every environment root under envs/. Modules are checked through the roots that use them.
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/envs/staging

      - run: terraform validate
        working-directory: infra/terraform/envs/staging

      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/envs/staging-bootstrap

      - run: terraform validate
        working-directory: infra/terraform/envs/staging-bootstrap
